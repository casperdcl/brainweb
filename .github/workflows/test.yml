name: ci
on:
  push:
  pull_request:
  schedule: [{cron: '4 3 1 * *'}]  # M H d m w (monthly at 3:04)
jobs:
  test:
    if: github.event_name != 'pull_request' || !contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association)
    strategy:
      matrix:
        python: [3.8, 3.14]
        os: [ubuntu]
        include: [{os: macos, python: 3.14}, {os: windows, python: 3.14}]
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 5
    defaults: {run: {shell: bash}}
    steps:
    - uses: actions/checkout@v7
      with: {fetch-depth: 0}
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - run: pip install -e .[full,dev]
    - run: pytest --cov=brainweb --cov-fail-under=50 --cov-report=xml --cov-report=term-missing
    - name: codacy
      run: |
        bash <(curl -fsL https://coverage.codacy.com/get.sh) report -l Python -r coverage.xml --partial || :
      env:
        CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
  finish:
    continue-on-error: ${{ github.event_name != 'push' }}
    needs: test
    runs-on: ubuntu-slim
    steps:
    - name: codacy
      run: |
        bash <(curl -fsL https://coverage.codacy.com/get.sh) final || :
      env:
        CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {contents: write, id-token: write, packages: write}
    steps:
    - uses: actions/checkout@v7
      with: {fetch-depth: 0}
    - uses: actions/setup-python@v7
      with: {python-version: '3.x'}
    - id: dist
      uses: casperdcl/deploy-pypi@v3
      with:
        build: true
        gpg_key: ${{ secrets.gpg_key }}
        upload: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags') }}
    - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
      name: Release
      run: |
        changelog=$(git log --pretty='format:%d%n- %s%n%b---' $(git tag --sort=v:refname | tail -n2 | head -n1)..HEAD)
        tag="${GITHUB_REF#refs/tags/}"
        gh release create --title "BrainWeb-based multimodal models $tag" --draft --notes "$changelog" "$tag" dist/${{ steps.dist.outputs.whl }} dist/${{ steps.dist.outputs.whl_asc }}
      env:
        GH_TOKEN: ${{ github.token }}
